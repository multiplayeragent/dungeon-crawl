<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Crawl</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0d0b16; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f1ecff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  #top { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); width: 200px; }
  #floor { font-weight: 800; font-size: 20px; }

  #hpbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d6d, #ff8fa3); transition: width .2s; }
  #inv { font-size: 14px; font-weight: 700; display: flex; gap: 12px; }
  #party { margin-top: 8px; font-size: 12px; }
  #party div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #party b { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: #ffffff22; position: relative; overflow: hidden; }
  #party b u { position: absolute; inset: 0 auto 0 0; background: #52d273; }

  #hint { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 130px); left: 50%; transform: translateX(-50%); width: min(440px, 86vw); text-align: center; padding: 10px 14px; border-radius: 14px; background: #1d1830cc; font-weight: 600; transition: opacity .5s; }
  #down { inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: radial-gradient(transparent 40%, #5a0010aa); }
  #down[hidden], #over[hidden], #atk[hidden] { display: none; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0b16c0; }
  .card { width: min(340px, 88vw); padding: 22px; border-radius: 16px; background: #1d1830; border: 1px solid #ffffff22; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 23px; } .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffd166; }
  .card ol { text-align: left; margin: 0 0 14px; padding-left: 26px; font-size: 14px; } .card li span { float: right; }
  .card p { margin: 6px 0; font-size: 14px; opacity: .8; }

         border: 2px solid #ffffff66; background: #ffffff1c; color: #fff; font: 800 15px system-ui, sans-serif; touch-action: none; }

</style>

</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><div id="floor"></div><div id="hpbar"><i></i></div><div id="inv"></div><div id="party"></div></div>
<div class="hud" id="net">Connecting…</div>

  <h2 id="overTitle"></h2><p id="overSub"></p>

  <button class="go" id="again">Play again</button><p id="overNext"></p>
</div></div>
<script>
/* ═══ DUNGEON CRAWL · a Multiplayer Agent starter ════════════════════════════════════════
 * Clear it room by room. Loot as a team. Co-op, 1–4 players; AI companions fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speeds, hp, damage, the monster and item types, dungeon size
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   DUNGEON ....... building a floor from a seed: rooms, corridors, doors, stairs
 *   GAME (HOST) ... floors, monsters, loot, room clears, the AI companions.
 *                   Only the host runs this and writes shared state.
 *   ME ............ moving, swinging, getting hurt, picking up loot. Each player owns its own.
 *   DRAW .......... camera, tiles, monsters, heroes, torchlight, minimap
 *   HUD & RESULTS . floor, hp, inventory, party, results and the leaderboard
 *   INPUT ......... keyboard, touch stick, attack button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The HOST is the lowest sessionId among live players (heartbeat `hb` seen in the
 *     last 3s), worked out every frame. The host's browser runs the monsters.
 *   - The host writes: `floor` (ONE JSON field: id, v, floor number, seed, phase, which
 *     rooms are awake and cleared, loot awards; `v` goes up on every write), `mobs`
 *     (every monster, ~10/s), `loot` (items on the ground) and `bots` (the companions).
 *     Every client builds the same map from floor.seed. A new host adopts all of it.
 *   - Each player writes its OWN entity: `p` (position, facing, hp, swing count, down),
 *     `st` (attack, armor, gold), `n`/`c` (name, color) and `hb` once a second.
 *   - Intents to the host: "hit" {m, d} when your swing reaches a monster, "pick" {i}
 *     to grab loot (the first one to ask gets it, recorded in floor.awards),
 *     "descend" on the open stairs and "again" for a new run.
 *   - Monsters hurt players with a "hurt" {to, d} event; the player takes it off its own hp.
 *   - ?attract plays offline with companions only (the preview video is recorded from it).
 *   - Leaderboard "deepest-floor": the deepest floor each player reached.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  slotW: 15, slotH: 11,    // each room sits in a slot this many tiles across and down
  slots: 4,                // the dungeon is 4 × 4 slots
  firstRooms: 4,           // rooms on floor 1; one more per floor after that...
  maxRooms: 8,             // ...up to this many
  speed: 4.4,              // hero speed, tiles/s
  hp: 100,
  atk: 10,                 // damage per swing before swords
  swingEvery: 0.36,        // seconds between swings
  reach: 1.4,              // swing reach in tiles (a 140° arc in front of you)
  respawnMs: 6000,         // a downed hero gets back up after this, next to a friend
  descendMs: 2500,         // the pause on the stairs before the next floor
  resultsMs: 20000,        // the results show this long, then a new run starts
  seats: 3,                // AI companions fill the party up to this many heroes
  dropChance: 0.3,         // chance a monster drops loot
  growth: 0.2,             // monsters get 20% tougher each floor
  board: "deepest-floor",
  // floor = the first floor a monster appears on. speed in tiles/s, reach in tiles, every = seconds between bites.
  monsters: [
    { name: "Slime",    hp: 30,  speed: 1.5, dmg: 6,  reach: 0.8, every: 1.1, size: 0.36, color: "#62d26f", floor: 1 },
    { name: "Bat",      hp: 16,  speed: 3.0, dmg: 4,  reach: 0.7, every: 0.8, size: 0.28, color: "#a67bff", floor: 1, flutter: true },
    { name: "Skeleton", hp: 46,  speed: 2.1, dmg: 9,  reach: 0.9, every: 1.0, size: 0.36, color: "#d9d0b4", floor: 2 },
    { name: "Ogre",     hp: 230, speed: 1.6, dmg: 16, reach: 1.2, every: 1.4, size: 0.7,  color: "#d0844a", floor: 3, boss: true },
  ],
  items: [
    { name: "Heart",  heal: 30, color: "#ff4d6d", weight: 4 },
    { name: "Gem",    gold: 25, color: "#3de0d0", weight: 3 },
    { name: "Sword",  atk: 3,   color: "#d6dde8", weight: 1.5 },
    { name: "Shield", def: 1,   color: "#4da6ff", weight: 1.5 },
  ],
};
const BOT_NAMES = ["Sir Bonk", "Pip", "Rowan", "Mags", "Tilly", "Grim"];
const COLORS = ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'dungeon-crawl',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback, map = (v) => v) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fallback));
  memo.set(key, { raw, v });
  return v;
}
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers();

// ── DUNGEON ─────────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/** A floor from its seed: the same map on every client. Tiles: 0 wall, 1 floor, 2 stairs. */
function makeFloor(seed, n) {
  const r = mulberry32(seed), SW = CONFIG.slotW, SH = CONFIG.slotH, N = CONFIG.slots, W = SW * N, H = SH * N;
  const count = Math.min(CONFIG.maxRooms, CONFIG.firstRooms + n - 1);
  let path = [];
  for (let tries = 0; tries < 60 && path.length < count; tries++) { // a random walk over the slots that never crosses itself
    path = [[Math.floor(r() * N), Math.floor(r() * N)]];
    while (path.length < count) {
      const [x, y] = path.at(-1), next = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < N && b < N && !path.some(([c, d]) => c === a && d === b));
      if (!next.length) break;
      path.push(next[Math.floor(r() * next.length)]);
    }
  }
  const grid = (v) => Array.from({ length: H }, () => new Array(W).fill(v));
  const tile = grid(0), roomOf = grid(-1), doorOf = grid(-1);
  const rooms = path.map(([sx, sy], k) => {
    const w = 9 + 2 * Math.floor(r() * 3), h = 7 + 2 * Math.floor(r() * 2), x = sx * SW + Math.floor((SW - w) / 2), y = sy * SH + Math.floor((SH - h) / 2);
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { tile[j][i] = 1; roomOf[j][i] = k; }
    return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
  });
  // Corridors three tiles wide join each room to the next; the tiles just outside the next room are its door.
  for (let k = 0; k < rooms.length - 1; k++) {
    const [ax, ay] = path[k], [bx, by] = path[k + 1], A = rooms[k], B = rooms[k + 1];
    if (ay === by) {
      const y = ay * SH + Math.floor(SH / 2), right = bx > ax, from = right ? A.x + A.w : B.x + B.w, to = right ? B.x - 1 : A.x - 1, door = right ? B.x - 1 : B.x + B.w;
      for (let x = from; x <= to; x++) for (let j = y - 1; j <= y + 1; j++) { tile[j][x] = 1; if (x === door) doorOf[j][x] = k; }
    } else {
      const x = ax * SW + Math.floor(SW / 2), down = by > ay, from = down ? A.y + A.h : B.y + B.h, to = down ? B.y - 1 : A.y - 1, door = down ? B.y - 1 : B.y + B.h;
      for (let y = from; y <= to; y++) for (let i = x - 1; i <= x + 1; i++) { tile[y][i] = 1; if (y === door) doorOf[y][i] = k; }
    }
  }
  const last = rooms.at(-1), stairs = { x: Math.floor(last.cx), y: Math.floor(last.cy) };
  tile[stairs.y][stairs.x] = 2;
  const torches = rooms.flatMap((rm) => [[rm.x + 2, rm.y - 1], [rm.x + rm.w - 3, rm.y - 1]]).filter(([x, y]) => y >= 0 && tile[y][x] === 0);
  return { W, H, tile, roomOf, doorOf, rooms, stairs, torches, seed, n };
}
let D = null;
/** The current floor's map, rebuilt when the seed changes. */
function dungeon(f) { if (!D || D.seed !== f.seed || D.n !== f.n) { D = makeFloor(f.seed, f.n); paintTiles(D); } return D; }
const roomAt = (x, y) => (D && D.roomOf[Math.floor(y)]?.[Math.floor(x)]) ?? -1;
/** Walls and locked doors block. Door k opens when room k is cleared. */
function solid(tx, ty) {
  if (!D || ty < 0 || tx < 0 || ty >= D.H || tx >= D.W || D.tile[ty][tx] === 0) return true;
  const k = D.doorOf[ty][tx], f = floorMeta();
  return k >= 0 && !(f && f.cleared.includes(k));
}
const blocked = (x, y, r) => solid(Math.floor(x - r), Math.floor(y - r)) || solid(Math.floor(x + r), Math.floor(y - r)) || solid(Math.floor(x - r), Math.floor(y + r)) || solid(Math.floor(x + r), Math.floor(y + r));
function moveBody(e, dx, dy, r) { const stuck = blocked(e.x, e.y, r); if (stuck || !blocked(e.x + dx, e.y, r)) e.x += dx; if (stuck || !blocked(e.x, e.y + dy, r)) e.y += dy; }
/** The next tile centre on the shortest walk from (x, y) to (gx, gy), for companions and the autopilot. */
function nextStep(x, y, gx, gy) {
  const W = D.W, start = Math.floor(gy) * W + Math.floor(gx), goal = Math.floor(y) * W + Math.floor(x), dist = new Map([[start, 0]]), queue = [start];
  for (let qi = 0; qi < queue.length && !dist.has(goal); qi++) {
    const c = queue[qi], cx = c % W, cy = (c / W) | 0;
    for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) { const k = ny * W + nx; if (!dist.has(k) && !solid(nx, ny)) { dist.set(k, dist.get(c) + 1); queue.push(k); } }
  }
  if (!dist.has(goal)) return { x: gx, y: gy };
  const cx = Math.floor(x), cy = Math.floor(y);
  let best = null, bd = dist.get(goal);
  for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) { const v = dist.get(ny * W + nx); if (v !== undefined && v < bd) { bd = v; best = { x: nx + 0.5, y: ny + 0.5 }; } }
  return best || { x: gx, y: gy };
}

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { f: null, mobs: [], loot: [], bots: new Map(), wasHost: false, dirtyF: false, dirtyL: false, lastF: 0, lastM: 0, lastB: 0, nextId: 1, hitAt: new Map() };
const hosting = () => isHost() && host.f;
const floorMeta = () => (hosting() ? host.f : shared("floor", null));
/** Monsters as { i, t (type), x, y, hp, a (biting), k (home room) }. */
const mobList = () => (hosting() ? host.mobs : shared("mobs", [], (l) => l.map(([i, t, x, y, hp, a, k]) => ({ i, t, x, y, hp, a, k }))));
const lootList = () => (hosting() ? host.loot : shared("loot", [], (l) => l.map(([i, k, x, y]) => ({ i, k, x, y }))));
const botList = () => (hosting() ? [...host.bots.values()].map((b) => ({ i: b.id, n: b.n, c: b.c, x: b.x, y: b.y, f: b.f, hp: b.hp, mhp: b.mhp, sw: b.sw, dn: b.dn ? 1 : 0 })) : shared("bots", []));
const scale = (n) => 1 + CONFIG.growth * (n - 1);
const maxHp = (t, n) => Math.round(CONFIG.monsters[t].hp * scale(n));
const allCleared = (f) => D && f.cleared.length >= D.rooms.length;

function startFloor(n, id) {
  const seed = (Math.random() * 1e9) | 0, d = (D = makeFloor(seed, n)), old = host.f;
  paintTiles(d);
  host.f = { id, v: old?.v || 0, n, seed, phase: "play", awake: [0], cleared: [0], endsAt: 0, awards: [], kills: n > 1 && old ? old.kills : 0 };
  host.mobs = []; host.loot = [];
  d.rooms.forEach((rm, k) => {
    if (k === 0) return;
    const kinds = CONFIG.monsters.map((M, t) => t).filter((t) => CONFIG.monsters[t].floor <= n && !CONFIG.monsters[t].boss);
    const count = ATTRACT ? 9 : Math.min(7, 2 + Math.floor(n / 2) + Math.floor(Math.random() * 2));
    const list = Array.from({ length: count }, (_, i) => kinds[ATTRACT ? i % kinds.length : Math.floor(Math.random() * kinds.length)]);
    if (k === d.rooms.length - 1 && n >= 3) list.push(CONFIG.monsters.findIndex((M) => M.boss));
    for (const t of list) {
      let x = rm.x + 1.5 + Math.random() * (rm.w - 3), y = rm.y + 1.5 + Math.random() * (rm.h - 3);
      if (ATTRACT && k === 1) { const s = spawnSpot(d, "a"); x = Math.max(rm.x + 1, Math.min(rm.x + rm.w - 1, 2 * rm.cx - s.x + (Math.random() - 0.5) * 3)); y = Math.max(rm.y + 1, Math.min(rm.y + rm.h - 1, 2 * rm.cy - s.y + (Math.random() - 0.5) * 3)); } // across the room from the heroes
      host.mobs.push({ i: host.nextId++, t, x, y, hp: maxHp(t, n) * (ATTRACT ? 3 : 1), k, cd: 1, a: 0 });
    }
  });
  for (const b of host.bots.values()) { const s = spawnSpot(d, b.id); Object.assign(b, { x: s.x, y: s.y, dn: false, hp: n === 1 ? b.mhp : Math.min(b.mhp, b.hp + 30), path: null }); if (n === 1) Object.assign(b, { atk: CONFIG.atk, def: 0 }); }

}
/** Where a hero appears on a new floor: the first room (or, in the preview, right in the action). */
function spawnSpot(d, id) {
  const k = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0), jx = ((k % 3) - 1) * 1.4, jy = ((Math.floor(k / 3) % 3) - 1) * 1.1;
  if (ATTRACT) { // just inside room 1, by the door from room 0
    const a = d.rooms[1], b = d.rooms[0], dx = Math.sign(b.cx - a.cx), dy = Math.sign(b.cy - a.cy);
    return { x: a.cx + dx * (a.w / 2 - 1.5) + jx * (dx ? 0.3 : 1), y: a.cy + dy * (a.h / 2 - 1.5) + jy * (dy ? 0.3 : 1) };

}
/** Become host: take over the floor exactly as state has it. */
function adopt() {
  host.f = parse(S.shared.floor, null);
  host.mobs = parse(S.shared.mobs, []).map(([i, t, x, y, hp, a, k]) => ({ i, t, x, y, hp, k, cd: 1, a: 0 }));
  host.loot = parse(S.shared.loot, []).map(([i, k, x, y]) => ({ i, k, x, y }));
  host.bots.clear();
  for (const b of parse(S.shared.bots, [])) host.bots.set(b.i, { id: b.i, n: b.n, c: b.c, x: b.x, y: b.y, f: b.f, hp: b.hp, mhp: b.mhp, sw: b.sw, dn: !!b.dn, up: Date.now() + 3000, atk: CONFIG.atk + 3, def: 1, cd: 0 });
  host.nextId = 1 + Math.max(0, ...host.mobs.map((m) => m.i), ...host.loot.map((l) => l.i), ...(host.f?.awards || []).map((a) => a[0]));

}
/** Everyone in the party who is up: { id, x, y, bot }. */
function party(includeDown) {
  const out = [], fid = floorMeta()?.id; // a hero still on the last floor isn't down on this one
  for (const id of humans()) {
    if (id === net.sessionId) { if (includeDown || !(me.dn && me.floorId === fid)) out.push({ id, x: me.x, y: me.y }); continue; }
    const p = parse(S.entities.players[id]?.p, null); if (p && (includeDown || !(p.dn && p.fl === fid))) out.push({ id, x: p.x, y: p.y, dn: p.dn });
  }
  for (const b of host.bots.values()) if (includeDown || !b.dn) out.push({ id: b.id, x: b.x, y: b.y, bot: true, dn: b.dn });

}
const actor = (id) => party(true).find((p) => p.id === id);

  for (const m of mobList()) { if (!f.awake.includes(m.k)) continue; const v = eased("m" + m.i, m.x, m.y, dt); things.push({ y: v.y, draw: () => drawMob(m, v, sx, sy, f.n) }); }
  for (const [id, p] of Object.entries(S.entities.players || {})) {

    const v = eased(id, h.x, h.y, dt); things.push({ y: v.y, draw: () => drawHero(sx(v.x), sy(v.y), h.f, p.c || "#ccc", p.n || "Player", h.hp / h.mhp, swingAge(id, h.sw), h.dn, 0) });
  }
  for (const b of botList()) { const v = eased(b.i, b.x, b.y, dt); things.push({ y: v.y, draw: () => drawHero(sx(v.x), sy(v.y), b.f, b.c, ATTRACT ? "" : b.n, b.hp / b.mhp, swingAge(b.i, b.sw), b.dn, 0) }); }
  things.push({ y: me.y, draw: () => drawHero(sx(me.x), sy(me.y), me.f, myColor, ATTRACT ? "" : "You", me.hp / me.mhp, swingAge("me", me.sw), me.dn, me.flash) });
  things.sort((a, b) => a.y - b.y).forEach((t) => t.draw());
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life += dt; if (p.life > p.max) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(sx(p.x) - 2, sy(p.y) - 2, 4, 4); }
  ctx.globalAlpha = 1;
  // torchlight: darkness everywhere except around heroes, torches and the open stairs
  lctx.globalCompositeOperation = "source-over"; lctx.fillStyle = ATTRACT ? "rgba(8,6,20,0.6)" : "rgba(8,6,20,0.82)"; lctx.fillRect(0, 0, lightCv.width, lightCv.height);
  lctx.globalCompositeOperation = "destination-out";
  const light = (x, y, r) => { const X = sx(x) / 3, Y = sy(y) / 3, R = (r * TS) / 3; if (X < -R || Y < -R || X > lightCv.width + R || Y > lightCv.height + R) return; const g = lctx.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(0.55, "rgba(0,0,0,0.75)"); g.addColorStop(1, "rgba(0,0,0,0)"); lctx.fillStyle = g; lctx.fillRect(X - R, Y - R, R * 2, R * 2); };
  light(me.x, me.y, 6.5);

  for (const [x, y] of d.torches) light(x + 0.5, y + 1, 3 + Math.sin(now / 90 + x) * 0.2);

const cam = { x: 0, y: 0 };
function drawItem(k, x, y, s) {

  if (down) { ctx.globalAlpha = 0.5; ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y + r * 0.4, r * 1.1, r * 0.6, 0, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.font = `700 ${Math.round(TS * 0.3)}px system-ui`; ctx.textAlign = "center"; ctx.fillText("✚", x, y - r * 0.6); ctx.globalAlpha = 1; return; }

    ctx.strokeStyle = `rgba(255,255,255,${0.8 - k * 0.6})`; ctx.lineWidth = TS * 0.14; ctx.beginPath(); ctx.arc(x, y, CONFIG.reach * TS * 0.75, face - 1.3, a0); ctx.stroke();
  }
  const sa = swingT < 0.18 ? face - 1.3 + (swingT / 0.18) * 2.6 : face + 0.9;
  ctx.strokeStyle = "#dfe6f0"; ctx.lineWidth = TS * 0.08; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x + Math.cos(sa) * r * 0.7, y + Math.sin(sa) * r * 0.7); ctx.lineTo(x + Math.cos(sa) * r * 2.1, y + Math.sin(sa) * r * 2.1); ctx.stroke();
  ctx.fillStyle = flash > 0 ? "#fff" : color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#0007"; ctx.stroke();
  ctx.fillStyle = "#ffe0bd"; ctx.beginPath(); ctx.arc(x + fx * r * 0.35, y + fy * r * 0.35 - r * 0.1, r * 0.55, 0, 7); ctx.fill();
  ctx.fillStyle = "#222"; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + fx * r * 0.6 - fy * s * r * 0.22, y + fy * r * 0.6 + fx * s * r * 0.22 - r * 0.1, r * 0.09, 0, 7); ctx.fill(); }
  if (hpPct < 1) { ctx.fillStyle = "#0008"; ctx.fillRect(x - r, y - r - 9, r * 2, 5); ctx.fillStyle = hpPct > 0.4 ? "#52d273" : "#ff4d6d"; ctx.fillRect(x - r, y - r - 9, r * 2 * Math.max(0, hpPct), 5); }

}
function drawMob(m, v, sx, sy, n) {
  const M = CONFIG.monsters[m.t], r = M.size * TS, t = performance.now() / 1000, prev = lastHp.get(m.i);
  if (prev !== undefined && m.hp < prev) { views.get("m" + m.i).hit = performance.now(); sparks(v.x, v.y, "#fff3c4", 4); }
  lastHp.set(m.i, m.hp);
  const hitT = (performance.now() - (views.get("m" + m.i).hit || 0)) / 1000, x = sx(v.x), y = sy(v.y) - (m.a ? r * 0.25 : 0);
  ctx.fillStyle = "#0006"; ctx.beginPath(); ctx.ellipse(x, sy(v.y) + r * 0.7, r, r * 0.35, 0, 0, 7); ctx.fill();
  ctx.fillStyle = hitT < 0.12 ? "#fff" : M.color;
  if (m.t === 0) { const w = 1 + Math.sin(t * 6 + m.i) * 0.08; ctx.beginPath(); ctx.ellipse(x, y + r * 0.2, r * w, r * (1.9 - w) * 0.85, 0, Math.PI, 0); ctx.lineTo(x + r * w, y + r * 0.55); ctx.lineTo(x - r * w, y + r * 0.55); ctx.fill(); }

  ctx.fillStyle = "#0009"; ctx.fillRect(x0 - 4, y0 - 4, d.W * k + 8, d.H * k + 8);

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let boardApi = null, boardFor = -1, msgTimer = 0, lastPhase = "", lastCleared = 0, hintUntil = 0;
function banner(text) { $("msg").textContent = text; $("msg").style.opacity = 1; clearTimeout(msgTimer); msgTimer = setTimeout(() => ($("msg").style.opacity = 0), 1600); }
function hud(f) {
  if (ATTRACT) { for (const id of ["top", "net", "hint", "msg"]) $(id).style.display = "none"; $("net").textContent = ""; return; }
  if (f.cleared.length > lastCleared && lastCleared) banner(allCleared(f) ? "Floor cleared! Find the stairs" : "Room cleared! The door is open");
  lastCleared = f.cleared.length;
  if (f.phase !== lastPhase) { if (f.phase === "descend") banner("Down the stairs…"); lastPhase = f.phase; }
  $("floor").textContent = `Floor ${f.n}`;
  $("hpbar").firstElementChild.style.width = `${Math.max(0, (me.hp / me.mhp) * 100)}%`;
  $("inv").innerHTML = `<span>⚔ ${me.atk}</span><span>🛡 ${me.def}</span><span style="color:#3de0d0">◆ ${me.gold}</span>`;
  const rows = [];
  for (const id of humans()) { if (id === net.sessionId) continue; const p = S.entities.players[id] || {}, h = parse(p.p, null); if (h) rows.push({ n: p.n || "Player", c: p.c, hp: h.hp / h.mhp, dn: h.dn }); }
  for (const b of botList()) rows.push({ n: b.n + " (bot)", c: b.c, hp: b.hp / b.mhp, dn: b.dn });
  $("party").innerHTML = rows.map((r) => `<div><b><u style="width:${Math.max(0, r.hp * 100)}%;background:${r.dn ? "#ff4d6d" : esc(r.c)}"></u></b>${esc(r.n)}${r.dn ? " · down" : ""}</div>`).join("");
  const n = humans().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the monsters" : ""}`;
  $("hint").style.opacity = performance.now() < hintUntil ? 1 : 0;
  $("down").hidden = !me.dn || f.phase === "over";
  if (me.dn) $("down").textContent = `You're down! Back up in ${Math.max(0, Math.ceil((me.up - Date.now()) / 1000))}s`;
  $("over").hidden = f.phase !== "over";
  if (f.phase === "over") {
    $("overTitle").textContent = `The party fell on floor ${f.n}`;
    $("overSub").textContent = `${f.kills} monsters slain · ◆ ${me.gold} gold`;
    $("overNext").textContent = `New run in ${Math.max(0, Math.ceil((f.endsAt - Date.now()) / 1000))}s`;

function showBoard(n) {
  const list = $("board");
  if (!boardApi) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  boardApi.submit(n).catch(() => null).then(() => boardApi.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>floor ${e.score}</span></li>`).join("") : "<li>No runs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => act("again");

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
function readKeys() {
  if (stick.id !== null) return;
  input.x = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  input.y = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (!atkHeld) input.attack = keys.has(" ") || keys.has("j") || keys.has("k");
}
addEventListener("keydown", (e) => { keys.add(e.key.toLowerCase()); if (e.key === " " || e.key.startsWith("Arrow")) e.preventDefault(); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
// Touch: drag anywhere on the left side for a thumb stick; hold ATTACK on the right.
const stick = { id: null, x: 0, y: 0 };
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); if (e.pointerType === "mouse" || e.clientX > W * 0.6) return; stick.id = e.pointerId; stick.x = e.clientX; stick.y = e.clientY; cv.setPointerCapture(e.pointerId); });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
/** The room's state can arrive just after we join: if someone (or a bot) already had my color, take a free one. */
function fixMyColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList();
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.some((b) => b.c === myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots.map((b) => b.c)]);

}

  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const f = floorMeta();
  if (f) { dungeon(f); myTick(dt, f); draw(f, dt); drawStick(); if (now - lastHud > 150) { lastHud = now; hud(f); } }
  requestAnimationFrame(frame);
}

(async function start() {
  if (ATTRACT) { Object.assign(CONFIG, { seats: 3, respawnMs: 2000, atk: 6 }); me.atk = CONFIG.atk; }
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (m, from) => { if (isHost() && m) applyHit(m, from); });
  net.on("pick", (m, from) => { if (isHost() && m) applyPick(m, from); });
  net.on("descend", () => { if (isHost()) applyDescend(); });
  net.on("again", () => { if (isHost()) applyAgain(); });
  net.on("hurt", (m) => { if (!m) return; if (m.to === net.sessionId) hurtMe(+m.d || 0); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") boardApi = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  $("hint").textContent = touchUI ? "Drag on the left to move, hold ATTACK to swing. Clear each room to open the next door, then find the stairs." : "WASD or arrows to move, Space to swing. Clear each room to open the next door, then find the stairs.";
  hintUntil = performance.now() + 12000;
  requestAnimationFrame(frame);
})();
